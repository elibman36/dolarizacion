name: Enviar las claves por email

# Manda por email las claves de la última semana cerrada (de data/monitor.json,
# que actualiza la corrida diaria), con un enlace al tablero. Sin adjuntos.
on:
  workflow_dispatch:
    inputs:
      para:
        description: "Destinatarios separados por coma. Vacío = la lista del secreto REPORTE_PARA."
        required: false
      solo_contar:
        description: "Sólo contar los destinatarios de REPORTE_PARA (no manda nada)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements.txt matplotlib

      - name: Enviar
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORTE_PARA: ${{ secrets.REPORTE_PARA }}
          PARA: ${{ github.event.inputs.para }}
          SOLO_CONTAR: ${{ github.event.inputs.solo_contar }}
        run: |
          if [ "$SOLO_CONTAR" = "true" ]; then
            python -m monitor.enviar --contar | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PARA" ]; then
            python -m monitor.enviar --para "$PARA"
          else
            python -m monitor.enviar
          fi

      - name: Registrar el envío
        # Sólo queda registrado si salió a la lista completa (5 o más): así el
        # envío automático del lunes no repite esa semana.
        run: |
          git config user.name "monitor-dolarizacion[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/envios.json
          if ! git diff --cached --quiet; then
            git commit -m "Envío del Dolarómetro registrado"
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}"
            git push
          fi
