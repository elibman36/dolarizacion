name: Dolarómetro semanal por email (lunes)

# Los lunes a las 6:37 hora Argentina manda el mail con la semana que cerró el
# viernes (data/monitor.json, que deja la actualización diaria) a la lista del
# secreto REPORTE_PARA. Si esa semana ya salió a la lista completa (por
# ejemplo, un envío a mano antes del lunes), no la repite: el registro está en
# data/envios.json. La segunda hora es un reintento por si GitHub saltea la
# primera.
on:
  schedule:
    - cron: "37 9 * * 1"
    - cron: "37 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-dolarizacion
  cancel-in-progress: false

env:
  ENVIO_AUTOMATICO: "true"

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements.txt matplotlib

      - name: Enviar por email
        if: ${{ env.ENVIO_AUTOMATICO == 'true' }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORTE_PARA: ${{ secrets.REPORTE_PARA }}
        run: python -m monitor.enviar --semanal

      - name: Registrar el envío
        run: |
          git config user.name "monitor-dolarizacion[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/envios.json
          if ! git diff --cached --quiet; then
            git commit -m "Envío semanal del Dolarómetro registrado"
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}"
            git push
          fi
