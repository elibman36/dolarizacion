name: Monitor de dolarización (actualización diaria)

on:
  schedule:
    # Días hábiles 19:17 y 22:47 hora Argentina (UTC-3): cierre de mercado y
    # segunda pasada para tomar datos del BCRA publicados más tarde.
    - cron: "17 22 * * 1-5"
    - cron: "47 1 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor/**"

permissions:
  contents: write

concurrency:
  group: monitor-dolarizacion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Descargar datos y recalcular el IPD
        run: python -m monitor.build

      - name: Dolarización financiera
        continue-on-error: true
        env:
          BCU_SSL_VERIFY: "0"
        run: python -m monitor.financiera

      - name: Publicar datos
        run: |
          git config user.name "monitor-dolarizacion[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Monitor de dolarización: datos al $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            # Las licitaciones se acumulan: si en el medio entró otra copia,
            # se unen las dos en vez de quedarse con la de esta corrida.
            if git show "origin/${GITHUB_REF_NAME}:data/series/licitaciones_dl.csv" > /tmp/lic_remoto.csv 2>/dev/null; then
              python -m monitor.licitaciones --fusionar /tmp/lic_remoto.csv
              git add data/series/licitaciones_dl.csv
              git diff --cached --quiet || git commit --amend --no-edit
            fi
            git push
          fi
